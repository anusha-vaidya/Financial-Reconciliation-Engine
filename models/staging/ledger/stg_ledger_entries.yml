version: 2

models:
  - name: stg_ledger_entries
    columns:
      - name: ledger_entry_id
        tests:
          - unique
          - not_null

      - name: entry_date
        tests:
          - not_null

      - name: entry_type
        tests:
          - accepted_values:
              values: ['credit', 'debit']

      - name: reference_id
        tests:
          - relationships:
              to: ref('stg_bank_transactions')
              field: transaction_id
              config:
                severity: warn
