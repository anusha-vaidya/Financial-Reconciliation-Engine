version: 2

models:
  - name: stg_bank_transactions
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null

      - name: transaction_date
        tests:
          - not_null

      - name: amount
        tests:
          - not_null

      - name: transaction_type
        tests:
          - accepted_values:
              values: ['credit', 'debit']
